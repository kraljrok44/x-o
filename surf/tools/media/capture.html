<!doctype html>
<html><head><meta charset="utf-8"><title>GLIDEZONE media</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #k { position: fixed; display: none; pointer-events: none; filter: drop-shadow(0 18px 40px rgba(0,0,0,.55)); }
  #grade { position: fixed; inset: 0; pointer-events: none; display: none; }
  #title { position: fixed; display: none; text-align: center; pointer-events: none;
    font-family: 'Inter Display', Inter, sans-serif; font-weight: 900; font-style: italic; letter-spacing: -0.02em; line-height: .9;
    color: #fff; }
  #title .t { display: inline-block; transform: skewX(-8deg);
    background: linear-gradient(180deg, #ffffff 0%, #d9fbff 45%, #5ee7ff 70%, #2a8cff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    -webkit-text-stroke: 0.012em rgba(6, 16, 40, .85);
    filter: drop-shadow(0 0.04em 0 #0a1a3a) drop-shadow(0 0 0.18em rgba(80, 220, 255, .65)) drop-shadow(0 0.1em 0.25em rgba(0,0,0,.6)); }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: Inter, sans-serif; color: #fff; }
  #dot { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.6); }
  .spd { position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%); text-align: center; }
  #spd { font-size: calc(var(--u) * 5.2); font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .uu { font-size: calc(var(--u) * 1.6); opacity: .75; margin-left: .3em; font-weight: 600; }
  .tim { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); padding: .35em .9em; border-radius: .6em;
    background: rgba(8,12,24,.45); font-size: calc(var(--u) * 2.6); font-weight: 700; font-variant-numeric: tabular-nums; }
</style></head>
<body>
<canvas id="c"></canvas>
<div id="grade"></div>
<canvas id="k"></canvas>
<div id="title"><span class="t">GLIDEZONE</span></div>
<div id="hud" style="display:none">
  <div id="dot"></div>
  <div class="tim" id="tim">0:00.00</div>
  <div class="spd"><span id="spd">0</span><span class="uu">u/s</span></div>
</div>
<script src="capture.bundle.js"></script>
</body></html>
